<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardápio do Vitinho</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Cardápio do Vitinho</h1>
      <div id="cart-icon" onclick="toggleCart()">
        🛒 <span id="cart-count">0</span>
      </div>
    </header>

    <main>
      <div class="bucket-configurator">
        <img
          class="bucket-image"
          src="pipoca_gourme.png"
          alt="Balde de Pipoca"
        />

        <div class="mode-selector">
          <button
            id="btn-mode-1"
            class="mode-btn active"
            onclick="setBucketMode(1)"
          >
            1 Sabor
          </button>
          <button id="btn-mode-2" class="mode-btn" onclick="setBucketMode(2)">
            2 Sabores
          </button>
        </div>

        <div id="flavors-container" class="flavors-grid">
          <!-- Sabores gerados via JavaScript -->
        </div>

        <div class="price-display">
          <h2 id="display-price">R$ 25,00</h2>
        </div>

        <div class="actions">
          <div class="qtd-selector">
            <button class="btn-minus" onclick="changeBucketQtd(-1)">-</button>
            <span id="display-qtd" class="qtd-value">1</span>
            <button class="btn-plus" onclick="changeBucketQtd(1)">+</button>
          </div>
          <button
            id="btn-add-bucket"
            class="btn-add"
            onclick="addBucketToCart()"
          >
            Adicionar
          </button>
        </div>
      </div>
    </main>

    <div id="cart-modal" class="hidden">
      <div class="cart-content">
        <div class="cart-header">
          <h2>Seu Pedido</h2>
          <button class="close-btn" onclick="toggleCart()">X</button>
        </div>
        <div id="cart-items-container"></div>

        <div class="cart-footer">
          <div class="delivery-section">
            <h3 class="section-title">Como deseja receber?</h3>
            <div class="delivery-options">
              <button
                id="btn-delivery"
                class="delivery-btn active"
                onclick="setDeliveryMode('delivery')"
              >
                Entrega Padrão <span class="delivery-fee">+ R$ 10,00</span>
              </button>
              <button
                id="btn-pickup"
                class="delivery-btn"
                onclick="setDeliveryMode('pickup')"
              >
                Retirar no Local
              </button>
            </div>
            <div id="pickup-address" class="hidden">
              📍 <strong>Endereço para retirada:</strong><br />
              Rua João Antônio Tornich 108, Jardim São Rafael
            </div>
            <input
              type="text"
              id="customer-address"
              placeholder="Qual o endereço de entrega?"
            />
          </div>

          <h3>Total: <span id="cart-total">R$ 0,00</span></h3>
          <input
            type="text"
            id="customer-name"
            placeholder="Digite seu nome"
            required
          />
          <button class="checkout-btn" onclick="checkout()">
            Finalizar Pedido
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
